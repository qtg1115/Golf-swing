# 「골프 느낌의 실제 원리」 — book structure
# Single source of truth for the ebook build.
# Reader-facing video links are intentionally absent: see media/videos.yaml.

# Working title. Stays until the authors decide otherwise.
title: 골프 느낌의 실제 원리
subtitle: 프로가 말하는 감각을 실제 현상으로 풀다
language: ko
identifier: golf-neukkimui-siljae-wonri-ko
basename: golf-neukkimui-siljae-wonri

# Three authors, equal billing. Order is fixed for every reader-facing page.
authors:
  - name_ko: 이충원
    name_en: Logan Lee
    credential: 캐나다 골프 마스터 티칭 프로
  - name_ko: 방승호
    name_en: Bryan Bang
    credential: 마스터 퍼스널트레이너 · 17년
  - name_ko: 박세인
    name_en: Jason Park
    credential: 마스터 퍼스널트레이너 · 17년

# Explicit cover line break, so the title does not wrap mid-phrase.
cover_title_lines:
  - 골프 느낌의
  - 실제 원리

# Cover art and part-opener plates are drawn by scripts/make_plates.py. They
# carry no lettering at all: every word on the cover and on a part page is set
# from this file at build time.
cover_art: images/plates/cover-art.jpg

rights: © 2026 이충원 · 방승호 · 박세인. All rights reserved.

# The cover and title page carry no company branding by author instruction:
# no Logic Performance, no Logic Fitness. The video channel is credited on the
# 판권 (credits) page, not on the cover art.
cover_branding: none

# Locked channel name for the book's videos, hosted unlisted.
video_channel: 골프느낌원리

# Substack publication the manuscript was compiled from.
# NOTE: build-time provenance only. These URLs are paid/private and must never
# be rendered as a reader-facing link or encoded into a QR code.
source_publication: https://logicfitko.substack.com

front_matter:
  - id: title-page
    kind: title-page
  - id: how-to-read
    kind: markdown
    title: 이 책을 읽는 법
    file: front-matter/how-to-read.md

parts:
  - id: part-1
    number: 1
    title: 느낌은 있는데 스윙이 안 되는 이유
    intro: front-matter/part-1-intro.md
    plate: images/plates/part-1-footprints.jpg
    plate_alt: 길 위에 남은 두 발자국과 끊어진 길
    chapters:
      - id: p1-c1
        slug: womakers
        title: 골프 트레이닝에 대한 생각
        mark: images/plates/ch-p1-c1.jpg
        mark_alt: 한 바퀴가 열리기 직전의 원
      - id: p1-c2
        slug: 05f
        title: 골프를 배워도 잘 안 되는 이유
        mark: images/plates/ch-p1-c2.jpg
        mark_alt: 한 발자국

  - id: part-2
    number: 2
    title: 내 스윙의 문제를 찾는 법
    intro: front-matter/part-2-intro.md
    plate: images/plates/part-2-grid.jpg
    plate_alt: 가로 다섯 점과 가운데에서 위로 올라가는 화살표
