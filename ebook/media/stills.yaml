# Original stills for 3부 챕터 7 「릴리즈 타이밍은 발바닥에서 달라진다」.
#
# The six photographs the author attached, in this order. They are not a new
# chapter and they are not the stock Golf+club/ball header. Drop the files into
# images/incoming/ as 01…06 (any common image suffix) or write them under the
# dest names in images/photos/, then rerun `make media && make book`.
#
# https://logicfitko.substack.com/p/golf is this same section. Do not import
# its header graphic or any Logic Fitness arch mp4.

